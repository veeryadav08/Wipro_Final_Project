# Server Port
server.port=8080

# Application Name
spring.application.name=food-ordering-system

# ===================================================================
# DATABASE CONFIGURATION (MySQL)
# ===================================================================
# Set active profile to 'mysql' or update the credentials below when MySQL details are provided.
# By default, we support MySQL configuration below:

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Shivam@9211
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Script Execution
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Static Resources & Jackson JSON
spring.mvc.static-path-pattern=/**
spring.jackson.serialization.fail-on-empty-beans=false
